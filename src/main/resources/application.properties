spring.application.name=movigestion-api

# Spring DataSource Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/movigestion?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=12345678
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Spring Data JPA Configuration
spring.jpa.show-sql=true

# Spring Data JPA Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.hibernate.naming.physical-strategy=com.bicasteam.movigestion.api.shared.infrastructure.persistence.jpa.strategy.SnakeCasePhysicalNamingStrategy

# Spring auth
authorization.jwt.secret=claveMuySecreta123456
authorization.jwt.expiration.ms=86400000
springdoc.swagger-ui.oauth2-redirect-url=/swagger-ui/oauth2-redirect.html


springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html